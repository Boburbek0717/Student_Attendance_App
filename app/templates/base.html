<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SAT Factory{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}?v=score-tickets-2">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <main id="main-content" class="{% block main_class %}{% endblock %}">
        <header class="brand-header">
            <a class="brand" href="/" aria-label="SAT Factory home">
                <span class="brand-mark" aria-hidden="true">SF<span>.</span></span>
                <span><strong>SAT Factory</strong><small>BUILT THROUGH PRACTICE</small></span>
            </a>
            {% if user %}<a class="role-badge" href="/{{ user.role }}">{{ user.role|capitalize }} dashboard</a>{% else %}<a class="role-badge" href="/login">Course portal ↗</a>{% endif %}
        </header>
        {% block content %}{% endblock %}
        {% if user %}
        <form method="post" action="/logout" class="logout">
            <input type="hidden" name="csrf" value="{{ csrf_token }}">
            <button type="submit" class="secondary">Log out</button>
        </form>
        {% endif %}
    </main>
</body>
</html>
