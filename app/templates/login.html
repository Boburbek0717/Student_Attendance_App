{% extends "base.html" %}
{% block title %}Log in · Student Attendance Tracker{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label for="username">Username</label>
    <input id="username" name="username" value="{{ username }}" maxlength="100"
           autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" maxlength="128"
           autocomplete="current-password" required>
    <button type="submit">Log in</button>
</form>
<p class="hint">Students: ask your teacher for your account details.</p>
{% endblock %}
