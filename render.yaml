# Optional Render Blueprint. Creating it deploys publicly; review before applying.
services:
  - type: web
    name: sat-factory-portfolio-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/demo_host.py
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: SAT_FACTORY_PUBLIC_DEMO
        value: "1"
